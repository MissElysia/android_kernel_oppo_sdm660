name: 编译 OPPO-Snapdragon660-Android-Pie 的 核心与 Anykernel3 文档

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dtb:
        type: choice
        description: '是否备份 DTB'                
        required: true
        default: 'true'        
        options:
        - 'true'
        - 'false'
      rekernel:
        type: choice
        description: '是否开启 RE:Kernel'                
        required: true
        default: 'false'        
        options:
        - 'true'
        - 'false'
      debug:
        type: choice
        description: '是否开启快速进入 Recovery 模式'                
        required: true
        default: 'false'        
        options:
        - 'true'
        - 'false'
      ksubranch:
        type: choice
        description: '请选择 KernelSU 的第三方分叉'                
        required: true
        default: 'sukisu'        
        options:
        - 'rissu'
        - 'sukisu'
        - 'resukisu'
        - 'mihoy3rd'
      branch:
        type: choice
        description: '请选择第三方 KernelSU 的分支'                
        required: true
        default: 'builtin'        
        options:
        - 'builtin'
        - 'main'
        - '14524ff84107fc9031e78eed38defffe109a3ce7'
        - 'df2b414dc133fb1184567a54c8e08315f6dcc731'
        - '850183c9694aa5fa84d01687c018b84732cb6021'
        - 'susfs-rksu-master'
      susfs:
        type: choice
        description: '是否开启 SuspiciousFS'                
        required: true
        default: 'false'        
        options:
        - 'true'
        - 'false'
      device:
        type: choice
        description: '请选择装置名称'        
        required: true
        options:
        - 'OPPO R11s'
        - 'OPPO R11'
        - 'OPPO R11t'
        - 'OPPO R11 Plus'
        - 'OPPO R11 Plusk'
        - 'OPPO R11 Pluskt'
        - 'OPPO R11sPlus'
        - 'OPPO R11sPlust'
      target:
        type: choice
        description: '请选择装置内核代号'
        required: true
        options:
        - '17011'
        - '16051'
        - '16052'
        - '16103'
        - '16118'
        - '16116'
        - '17013'
        - '17021'
        - '17023'

jobs:
  build:
    name: ${{ github.actor }}编译的${{ github.event.inputs.device }}核心
    runs-on: ubuntu-22.04
    steps:

      - name: 获取分支的名称
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: 设定5GIB的SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: 安装所需的环境
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 libncurses5
          mkdir -p $GITHUB_WORKSPACE/workdir
          cd $GITHUB_WORKSPACE/workdir
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 获取稳定版旧版经典工具链
        run: |
          mkdir -p $GITHUB_WORKSPACE/workdir/clang
          mkdir -p $GITHUB_WORKSPACE/workdir/gcc64
          mkdir -p $GITHUB_WORKSPACE/workdir/gcc32
          
          # 下载原版 AOSP Clang 9.0.3
          wget -q https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-4988736/archive/refs/heads/9.0.0.tar.gz -O $GITHUB_WORKSPACE/workdir/clang.tar.gz
          tar -f $GITHUB_WORKSPACE/workdir/clang.tar.gz -xz -C $GITHUB_WORKSPACE/workdir/clang --strip-components=1
          
          # 下载预编译 GCC 4.9 支撑
          wget -q https://github.com/Krypton-Project/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/11.tar.gz -O $GITHUB_WORKSPACE/workdir/gcc64.tar.gz
          tar -f $GITHUB_WORKSPACE/workdir/gcc64.tar.gz -xz -C $GITHUB_WORKSPACE/workdir/gcc64 --strip-components=1
          
          wget -q https://github.com/Krypton-Project/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/archive/refs/heads/11.tar.gz -O $GITHUB_WORKSPACE/workdir/gcc32.tar.gz
          tar -f $GITHUB_WORKSPACE/workdir/gcc32.tar.gz -xz -C $GITHUB_WORKSPACE/workdir/gcc32 --strip-components=1

      - name: 获取核心源码
        run: |
          git clone --recursive https://github.com/yushihao0525/android_kernel_oppo_sdm660.git -b master --depth 1 $GITHUB_WORKSPACE/workdir/source

      - name: 设定 Ccache 的容量
        uses: hendrikmuhs/ccache-action@v1.2
        with:
         key: build-kernel-mido-kernel
         max-size: 2G

      - name: 添加 RE:Kernel 功能
        run: |
          if [ "${{ github.event.inputs.rekernel }}" == "true" ]; then
             echo -e "\nCONFIG_REKERNEL=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660_defconfig || true
             echo -e "\nCONFIG_REKERNEL=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660-perf_defconfig || true
          fi

      - name: 添加快速进入 Recovery 模式功能
        run: |
          if [ "${{ github.event.inputs.debug }}" == "true" ]; then
             echo -e "\nCONFIG_ELYSIA_DEBUG=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660_defconfig || true
             echo -e "\nCONFIG_ELYSIA_DEBUG=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660-perf_defconfig || true
          fi

      - name: 添加 SusFS 功能
        run: |
          if [ "${{ github.event.inputs.susfs }}" == "true" ]; then
             echo -e "\nCONFIG_KSU_SUSFS=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660_defconfig || true
             echo -e "\nCONFIG_KSU_SUSFS=y"  >> $GITHUB_WORKSPACE/workdir/source/arch/arm64/configs/oppo660-perf_defconfig || true
          fi

      - name: 添加 Rissu
        run: |
          if [ "${{ github.event.inputs.ksubranch }}" == "rissu" ]; then
             cd $GITHUB_WORKSPACE/workdir/source             
             curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.branch }}
             cd $GITHUB_WORKSPACE/workdir
          fi

      - name: 添加 SukiSU Ultra
        run: |
          if [ "${{ github.event.inputs.ksubranch }}" == "sukisu" ]; then
             cd $GITHUB_WORKSPACE/workdir/source             
             curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s ${{ github.event.inputs.branch }}
             cd $GITHUB_WORKSPACE/workdir
          fi

      - name: 添加 Re:Sukisu
        run: |
          if [ "${{ github.event.inputs.ksubranch }}" == "resukisu" ]; then
             cd $GITHUB_WORKSPACE/workdir/source             
             curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.branch }}
             cd $GITHUB_WORKSPACE/workdir
          fi

      - name: 添加 Debug
        run: |
          if [ "${{ github.event.inputs.ksubranch }}" == "mihoy3rd" ]; then
             cd $GITHUB_WORKSPACE/workdir/source             
             curl -LSs "https://raw.githubusercontent.com/mihoy3rd/SukiSU-Ultra/debug/kernel/setup.sh" | bash -s ${{ github.event.inputs.branch }}
             cd $GITHUB_WORKSPACE/workdir
          fi

      - name: 编译 ${{ github.event.inputs.device }} 核心
        run: |
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }})
          export ARCH=arm64
          export SUBARCH=arm64
          
          export PATH="$GITHUB_WORKSPACE/workdir/clang/bin:$GITHUB_WORKSPACE/workdir/gcc64/bin:$GITHUB_WORKSPACE/workdir/gcc32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          cd $GITHUB_WORKSPACE/workdir/source
          export OPPO_TARGET_DEVICE="MSM_${{ github.event.inputs.target }}"
          
          # 强行清理历史残留，保证树处于洁净状态
          make clean
          make mrproper
          rm -rf out
          mkdir -p out
          
          # 生成基础配置
          if [ -f arch/arm64/configs/oppo660-perf_defconfig ]; then
              make O=out oppo660-perf_defconfig CC=clang
          else
              make O=out oppo660_defconfig CC=clang
          fi
          
          # 开始全力编译（KCFLAGS=-w 屏蔽警告防止中断，不检查未定义引用的警告）
          make -j$(nproc --all) O=out CC=clang KCFLAGS="-w" EXTRA_CFLAGS="-w" 2>&1 | tee kernel.log

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: android_kernel_oppo_sdm660_${{ github.event.inputs.target }}_${{ env.BUILD_TIME }}_kernel.log
          path: workdir/source/kernel.log

      - name: 检查 ${{ github.event.inputs.device }} 的内核文档
        run: |
          cd $GITHUB_WORKSPACE/workdir/source
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
          else
              echo "Kernel output file is empty"
              exit 1
          fi

      - name: 制作 ${{ github.event.inputs.device }} 的 Anykernel3 文档
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git $GITHUB_WORKSPACE/workdir/ak3
          rm -rf $GITHUB_WORKSPACE/workdir/ak3/.git
          cp $GITHUB_WORKSPACE/workdir/source/out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/workdir/ak3

      - name: 上传 ${{ github.event.inputs.device }} 的 AnyKernel3 文档
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_oppo_sdm660_${{ github.event.inputs.target }}_${{ env.BUILD_TIME }}
          path: workdir/ak3/*
          
      - name: 制作 DTB 备份
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/workdir/dtb
          cd $GITHUB_WORKSPACE/workdir/dtb
          if [ "${{ github.event.inputs.dtb }}" == "true" ]; then 
             cp $GITHUB_WORKSPACE/workdir/source/out/arch/arm64/boot/dts/1*/*.dtb $GITHUB_WORKSPACE/workdir/dtb || true
          fi

      - name: 上传 DTB 备份
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DTB
          path: workdir/dtb/*
          
